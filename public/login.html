<!doctype html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>VIGIL — Sign in</title>
<style>
:root{--bg:#0b0b0a;--panel:#141413;--line:#26261f;--ink:#e8e8e6;--ink2:#b7b7b0;--muted:#6f6f68;--blue:#3987e5;--warn:#e8b53a;--mono:ui-monospace,SFMono-Regular,Menlo,monospace;--sans:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
*{box-sizing:border-box}html,body{height:100%}
body{margin:0;background:radial-gradient(circle at 50% 30%,#12140f,#080808 70%);color:var(--ink);font-family:var(--sans);display:flex;align-items:center;justify-content:center}
.card{width:min(380px,92vw);background:linear-gradient(180deg,#16160f,#0c0c0c);border:1px solid var(--line);border-radius:14px;padding:30px 28px;box-shadow:0 30px 90px rgba(0,0,0,.6)}
.brand{display:flex;align-items:center;gap:11px;margin-bottom:4px}
.brand svg{width:30px;height:30px}
.brand h1{font-size:20px;letter-spacing:3px;margin:0;font-weight:600}
.brand small{display:block;font-family:var(--mono);font-size:8.5px;letter-spacing:2px;color:var(--muted);margin-top:2px;font-weight:400}
.class{font-family:var(--mono);font-size:9px;letter-spacing:2px;color:var(--warn);text-align:center;margin:14px 0 18px;padding:5px;border:1px solid rgba(232,181,58,.3);border-radius:6px}
label{display:block;font-family:var(--mono);font-size:9px;letter-spacing:1px;color:var(--muted);text-transform:uppercase;margin:12px 0 5px}
input{width:100%;background:#0e0e0d;border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:11px 12px;font-size:14px;outline:none}
input:focus{border-color:var(--blue)}
button{width:100%;margin-top:20px;background:var(--blue);border:none;color:#fff;padding:12px;border-radius:8px;font-family:var(--mono);font-size:12px;letter-spacing:1.5px;cursor:pointer}
button:hover{background:#2f76cf}
.err{color:#e5484d;font-size:12px;margin-top:14px;min-height:16px;text-align:center}
.foot{font-family:var(--mono);font-size:8.5px;color:var(--muted);text-align:center;margin-top:18px;line-height:1.6}
</style></head><body>
<form class="card" id="f">
  <div class="brand">
    <svg viewBox="0 0 32 32" fill="none"><path d="M2 16 Q16 5 30 16 Q16 27 2 16 Z" stroke="#3aa0e5" stroke-width="1.8" fill="rgba(58,160,229,.06)"/><circle cx="16" cy="16" r="6.4" stroke="#e8b53a" stroke-width="1.5" fill="rgba(232,181,58,.12)"/><ellipse cx="16" cy="16" rx="2.7" ry="6.4" stroke="#e8b53a" stroke-width="1"/><line x1="9.6" y1="16" x2="22.4" y2="16" stroke="#e8b53a" stroke-width="1"/><circle cx="16" cy="16" r="1.5" fill="#e8b53a"/></svg>
    <div><h1>VIGIL<small>GLOBAL INSTABILITY MONITOR</small></h1></div>
  </div>
  <div class="class">UNCLASSIFIED // OSINT — AUTHORIZED ACCESS ONLY</div>
  <div style="font-size:10px;color:var(--muted);line-height:1.5;margin:-6px 0 4px;text-align:center">Open-source intelligence estimates — <b style="color:var(--ink2)">not official confirmation</b>. For situational awareness only.</div>
  <label for="u">Username</label>
  <input id="u" name="username" autocomplete="username" autofocus>
  <label for="p">Password</label>
  <input id="p" name="password" type="password" autocomplete="current-password">
  <button type="submit">SIGN IN</button>
  <div class="err" id="err"></div>
  <div class="foot">Access is monitored and logged.<br>Unauthorized use is prohibited.</div>
</form>
<script>
document.getElementById('f').addEventListener('submit',async e=>{
  e.preventDefault();
  const err=document.getElementById('err');err.textContent='';
  try{
    const r=await fetch('/api/login',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({username:u.value,password:p.value})});
    if(r.ok){location.href='/';return;}
    const d=await r.json().catch(()=>({}));err.textContent=d.error||'Invalid credentials';
  }catch(_){err.textContent='Sign-in failed. Try again.';}
});
</script></body></html>
